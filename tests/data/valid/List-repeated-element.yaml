# A list may hold one element in more than one place, here a at 1 and 3.
co_size: 3
item:
  - co_index: 1
    itemContent: https://example.org/a
    followedBy:
      - co_index: 2
        itemContent: https://example.org/b
      - co_index: 3
        itemContent: https://example.org/a
  - co_index: 2
    itemContent: https://example.org/b
  - co_index: 3
    itemContent: https://example.org/a
    precededBy:
      - co_index: 1
        itemContent: https://example.org/a
      - co_index: 2
        itemContent: https://example.org/b
