# CO's own example of a list writes its first and last items only as
# firstItem and lastItem, which CO makes narrower forms of item, and its
# middle item under item. The list holds all three.
co_size: 3
firstItem:
  co_index: 1
  itemContent: https://example.org/person/paolo
  nextItem:
    co_index: 2
    itemContent: https://example.org/person/marco
item:
  - co_index: 2
    itemContent: https://example.org/person/marco
    nextItem:
      co_index: 3
      itemContent: https://example.org/person/silvio
lastItem:
  co_index: 3
  itemContent: https://example.org/person/silvio
