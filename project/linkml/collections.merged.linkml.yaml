    "firstItem": {
      "name": "firstItem",
      "description": "The first item of the list.",
      "notes": [
        "CO makes it a narrower form of item, which is not stated here. LinkML's inheritance is monotonic, so a slot under item would be multivalued, as item is, and this one holds one item."
      ],
      "comments": [
        "It holds a copy of the item with index 1, which has no previous item."
      ],
      "from_schema": "https://w3id.org/lmodel/collections",
      "narrow_mappings": [
        "swan:firstItem"
      ],
      "domain": "List",
      "slot_uri": "coll:firstItem",
      "domain_of": [
        "List"
      ],
      "range": "ListItem",
      "inlined": true
    },
    "firstItemOf": {
      "name": "firstItemOf",
