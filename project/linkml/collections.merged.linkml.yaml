      "domain": "Collection",
      "slot_uri": "coll:size",
      "domain_of": [
        "Collection"
      ],
      "range": "integer",
      "minimum_value": 0
    },
    "item": {
      "name": "item",
      "description": "An item of the bag, which holds one of its elements.",
      "comments": [
