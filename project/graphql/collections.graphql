# metamodel_version: 1.12.0
# version: 2.0
type Bag
  {
    coSize: Int
    element: [CoElement]
    item: [CoItem]
  }

type CoElement
  {
    iri: String!
  }

type CoItem
  {
    itemContent: CoElement!
  }

type Collection
  {
    coSize: Int
    element: [CoElement]
  }

type List
  {
    coSize: Int
    element: [CoElement]
    firstItem: ListItem
    lastItem: ListItem
    item: [ListItem]
  }

type ListItem
  {
    itemContent: CoElement!
    coIndex: Int!
    nextItem: ListItem
    previousItem: ListItem
    followedBy: [ListItem]
    precededBy: [ListItem]
  }

type Set
  {
    coSize: Int
    element: [CoElement]
  }
