---
id: https://w3id.org/lmodel/collections
name: collections
title: Collections Ontology (CO)
description: >-
  The Collections Ontology (CO) 2.0 in LinkML, with CO's own names and IRIs:
  collections that are sets, bags or lists, and the items through which a bag
  or a list holds its elements.
version: "2.0"
source: https://github.com/collections-ontology/collections-ontology
license: Apache-2.0
see_also:
  - https://lmodel.github.io/collections
  - https://doi.org/10.3233/SW-130121
comments:
  - >-
    Renders CO 2.0 by Paolo Ciccarese and Silvio Peroni, whose ontology IRI is
    http://purl.org/co. The source is collections.owl at the commit the
    co_commit annotation names, copied unchanged to upstream/collections.owl.
  - >-
    The repository states no licence. The project's Google Code archive gives
    the Apache License 2.0 for its code, collections.owl among it, and CC BY
    3.0 for its other content, such as its wiki, as the co_licence annotation
    says. The descriptions here are this project's own words.
  - >-
    Items have no IRI here, so a slot that links to an item, such as
    firstItem or nextItem, holds a copy of that item. docs/index.md lists the
    rules of CO that no validator checks and the tests check instead.
notes:
  - >-
    CO's Item and size are named CoItem and co_size, as in lmodel/uco's
    uco_co module, because UCO defines an Item and a size of its own. CO's
    index is named co_index, because gen-doc writes the page of a slot named
    index over the schema's index page. Their IRIs are CO's.
annotations:
  co_ontology_iri: http://purl.org/co
  co_commit: 619e7b02646321174635fd04be658e338bf7d1d7
  co_git_object: 4e19e4892212de2b1805923a7a69fa4ba8c1b424
  co_licence: >-
    Apache-2.0 for code, collections.owl among it, and CC-BY-3.0 for other
    content, per the Google Code archive

prefixes:
  collections: https://w3id.org/lmodel/collections/
  coll: http://purl.org/co/
  linkml: https://w3id.org/linkml/

default_prefix: collections
default_range: string

imports:
  - linkml:types

slots:

  element:
    description: A thing the collection holds, named by its IRI.
    slot_uri: coll:element
    domain: Collection
    range: uriorcurie
    multivalued: true

  elementOf:
    description: A collection that holds the thing as an element.
    notes:
      - >-
        CO declares it the inverse of element. LinkML's Python generator
        states an inverse only between slots that range over classes, and
        element ranges over any thing named by its IRI, so the inverse is
        not stated here.
    slot_uri: coll:elementOf
    range: Collection
    multivalued: true
    inlined: true
    inlined_as_list: true

  co_size:
    description: >-
      How many times the collection holds a thing, counting each repeat: the
      number of elements of a set, or of items of a bag or a list.
    notes:
      - >-
        CO gives every collection exactly one size. The schema leaves it
        optional, since a reader can count; where it is given, the tests check
        that it equals the count.
    slot_uri: coll:size
    domain: Collection
    range: integer
    minimum_value: 0

  item:
    description: An item of the bag, which holds one of its elements.
    slot_uri: coll:item
    domain: Bag
    range: CoItem
    multivalued: true
    inlined: true
    inlined_as_list: true

  itemOf:
    description: A bag that holds the item.
    slot_uri: coll:itemOf
    inverse: item
    domain: CoItem
    range: Bag
    multivalued: true
    inlined: true
    inlined_as_list: true

  itemContent:
    description: The element that the item wraps.
    notes:
      - >-
        CoItem requires it. CO's OWL file makes itemContent functional, so an
        item wraps at most one element, and CO's wiki page StructureBag says
        that an item links exactly one resource.
    see_also:
      - https://github.com/collections-ontology/collections-ontology/blob/58e55d956991878307d430eede7790d5e5da206f/StructureBag.md
    slot_uri: coll:itemContent
    domain: CoItem
    range: uriorcurie

  itemContentOf:
    description: An item that wraps the thing.
    notes:
      - >-
        CO declares it the inverse of itemContent, which is not stated here
        for the reason given on elementOf.
    slot_uri: coll:itemContentOf
    range: CoItem
    multivalued: true
    inlined: true
    inlined_as_list: true

  co_index:
    description: The place of the item in its list, counting from 1.
    slot_uri: coll:index
    domain: ListItem
    range: integer
    minimum_value: 1

  firstItem:
    description: The first item of the list.
    comments:
      - It holds a copy of the item with index 1, which has no previous item.
    notes:
      - >-
        CO makes it a narrower form of item, which is not stated here: a
        LinkML slot inherits its parent's multivalued, and this one is single.
    slot_uri: coll:firstItem
    domain: List
    range: ListItem
    inlined: true

  firstItemOf:
    description: A list whose first item this is.
    slot_uri: coll:firstItemOf
    inverse: firstItem
    domain: ListItem
    range: List
    multivalued: true
    inlined: true
    inlined_as_list: true

  lastItem:
    description: The last item of the list.
    comments:
      - >-
        It holds a copy of the item with the highest index, which has no next
        item.
    notes:
      - >-
        CO makes it a narrower form of item, which is not stated here for the
        reason given on firstItem.
    slot_uri: coll:lastItem
    domain: List
    range: ListItem
    inlined: true

  lastItemOf:
    description: A list whose last item this is.
    slot_uri: coll:lastItemOf
    inverse: lastItem
    domain: ListItem
    range: List
    multivalued: true
    inlined: true
    inlined_as_list: true

  nextItem:
    description: The item that comes straight after this one.
    comments:
      - It holds a copy of the item whose index is one higher.
    notes:
      - >-
        CO makes it a narrower form of followedBy, which is not stated here
        for the reason given on firstItem.
    slot_uri: coll:nextItem
    domain: ListItem
    range: ListItem
    inlined: true

  previousItem:
    description: The item that comes straight before this one.
    comments:
      - It holds a copy of the item whose index is one lower.
    notes:
      - >-
        CO makes it a narrower form of precededBy, which is not stated here
        for the reason given on firstItem.
    slot_uri: coll:previousItem
    inverse: nextItem
    domain: ListItem
    range: ListItem
    inlined: true

  followedBy:
    description: An item that comes somewhere after this one.
    comments:
      - It holds copies of items whose index is higher.
    slot_uri: coll:followedBy
    domain: ListItem
    range: ListItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    transitive: true

  precededBy:
    description: An item that comes somewhere before this one.
    comments:
      - It holds copies of items whose index is lower.
    slot_uri: coll:precededBy
    inverse: followedBy
    domain: ListItem
    range: ListItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    transitive: true

classes:

  Collection:
    class_uri: coll:Collection
    description: A group of things that is taken as a whole.
    slots:
      - co_size
      - element
    disjoint_with:
      - CoItem

  Set:
    is_a: Collection
    class_uri: coll:Set
    description: A collection that holds each of its elements once.
    comments:
      - >-
        No validator checks that the elements differ: LinkML 1.12.1's
        generators drop list_elements_unique, so the tests check it.
    slot_usage:
      element:
        list_elements_unique: true

  Bag:
    is_a: Collection
    class_uri: coll:Bag
    description: A collection that may hold one element more than once, in no order.
    slots:
      - item
    disjoint_with:
      - Set

  List:
    is_a: Bag
    class_uri: coll:List
    description: A collection whose items come in order, one after another.
    comments:
      - >-
        No validator checks the order: that the indexes count from 1 with no
        gap or repeat, and that firstItem, lastItem and each item's links
        agree with them. The tests check it.
    slots:
      - firstItem
      - lastItem
    slot_usage:
      item:
        range: ListItem

  CoItem:
    class_uri: coll:Item
    description: An entry of a bag, which wraps one of the bag's elements.
    slots:
      - itemContent
    slot_usage:
      itemContent:
        required: true

  ListItem:
    is_a: CoItem
    class_uri: coll:ListItem
    description: An item of a list, which has a place in the list's order.
    slots:
      - co_index
      - nextItem
      - previousItem
      - followedBy
      - precededBy
    slot_usage:
      co_index:
        required: true
