[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
# Named like lmodel/slsa's slsa-linkml, so the PyPI name says what it holds.
# The import package is collections_linkml, because a package named
# collections would shadow the standard library's. PyPI publishing is off.
name = "collections-linkml"
description = "Collections Ontology (CO) 2.0 (LinkML)"
authors = [
  {name = "Noel McLoughlin", email = "noel.mcloughlin@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/collections_linkml"]

# The schema sits outside the package, at the path w3id.org serves, so the
# wheel carries it under the package's schema folder.
[tool.hatch.build.targets.wheel.force-include]
"src/collections/schema" = "collections_linkml/schema"

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/collections_linkml/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/collections_linkml/datamodel/collections_pydantic.py",
  "src/collections_linkml/datamodel/collections.py",
  # The Collections Ontology's file, copied unchanged; the neighbours' adapt
  # copies, copied as released; and files copied in by the KTL sidecar sync
  # or written by npm, not by hand.
  "src/collections/schema/upstream/*",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/collections_linkml/datamodel/collections_pydantic.py",
  "src/collections_linkml/datamodel/collections.py",
  "src/collections/schema/upstream/*",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]
